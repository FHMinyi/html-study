<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素选择器</title>
    <style>
        /* 元素选择器 */
        /* 选择所有div元素 */
        div {
            color: red;
        }
        /* 选择所有p元素 */
        p {
            color: blue;
        }
        /* 选择所有span元素 */
        span {
            color: green;
        }
    </style>
</head>
<body>
    <div>我是div</div>
    <p>我是p</p>
    <span>我是span</span>
</body>
</html>
