<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>类选择器</title>
    <style>
        /* 类选择器：.类名 */
        .I {
            color: red;
            font-size: 20px;
        }
        .Y {
            color: blue;
            font-size: 30px;
        }

        .big {
            font-size: 50px;
        }

        .。 {
            font-size: 100px;
        }
        

    </style>
</head>
<body>
    <h1>土味情话网</h1>
    <h2>1.你猜我喜欢你吗？</h2>
    <p class="I">我对你说：千山万水总是情，给个面子行不行</p>
    <p class="I">我对你说：千山万水总是情，给个面子行不行</p>
    <p class="I">我对你说：千山万水总是情，给个面子行不行</p>
    <p class="I">我对你说：千山万水总是情，给个面子行不行</p>
    <!-- class里可以写多个类名，空格隔开 -->
    <span class="I big">555555</span>
    <br>
    <h2>不认识你</h2>
    <p class="Y">这是一段话</p>
    <p class="Y">这是一段话</p>
    <p class="Y">这是一段话</p>
    <p class="Y">这是一段话</p>
    <p class="。">这是一段话</p>

</body>
</html>
