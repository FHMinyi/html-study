<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通配选择器</title>
    <style>
        * {
            color: red;
            font-size: 23px;
        }
    </style>
</head>
<body>
    <h1>通配选择器</h1>
    <p>通配选择器，也叫通用选择器，使用 * 表示，表示选中页面中的所有元素。</p>
    <p>注意：通配选择器会选中页面中所有的元素，谨慎使用。</p>
</body>
</html>
