<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        #topPage {
            background-image: url(./res/Konachan.com\ -\ 277780\ bed\ blonde_hair\ blush\ bow\ fang\ flandre_scarlet\ hat\ ponytail\ red_eyes\ scan\ short_hair\ skirt\ teddy_bear\ touhou\ vampire\ wings\ wristwear.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .leftfix {
            float: left;
        }

        .rightfix {
            float: right;
        }

        .clearfix::after {
            clear: both;
            display: block;
            content: "";
        }

        .container {
            width: 960px;
            background-color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin: 0 auto;
        }

        .logo,
        .banner1,
        .banner2 {
            height: 80px;
            line-height: 80px;
            background-color: rgba(128, 128, 128, 0.841);
        }

        .logo,
        .banner2 {
            width: 200px;
        }

        .banner1 {
            width: 540px;
            margin: 0 10px;
        }

        .meun {
            height: 30px;
            margin: 10px 0;
            background-color: rgba(128, 128, 128, 0.841);
            line-height: 30px;
        }

        .item1,
        .item2 {
            border: 1px solid black;
            height: 198px;
            width: 368px;
            margin-right: 10px;
        }


        .item7,
        .item8,
        .item9 {
            border: 1px solid black;
            height: 128px;
            width: 198px;
        }

        .item8 {
            margin: 10px 0;
        }

        .item3,
        .item4,
        .item5,
        .item6 {
            margin-top: 10px;
            height: 198px;
            width: 178px;
            border: 1px solid black;
            margin-right: 10px;
        }

        .bottom {
            margin-top: 10px;
        }

        .footer {
            background-color: rgba(128, 128, 128, 0.841);
            height: 60px;
            margin-top: 10px;
            line-height: 60px;
        }
    </style>
</head>

<body id="topPage">
    <!-- 大容器 -->
    <div class="container">
        <!-- 最上端页面 -->
        <div class="top-page clearfix">
            <div class="leftfix logo">logo</div>
            <div class="leftfix banner1">banner1</div>
            <div class="leftfix banner2">banner2</div>
        </div>
        <!-- 菜单页 -->
        <div class="meun">菜单</div>
        <!-- 内容区 -->
        <div class="content clearfix">
            <!-- 左区 -->
            <div class="leftfix leftbox">
                <!-- 顶部 -->
                <div class="leftfix top">
                    <div class="leftfix item1">栏目一</div>
                    <div class="leftfix item2">栏目二</div>
                </div>
                <!-- 底部 -->
                <div class=" bottom">
                    <div class="leftfix item3">栏目三</div>
                    <div class="leftfix item4">栏目四</div>
                    <div class="leftfix item5">栏目五</div>
                    <div class="leftfix item6">栏目六</div>
                </div>
            </div>
            <!-- 右区 -->
            <div class="leftfix rightbox">
                <div class="item7">栏目七</div>
                <div class="item8">栏目八</div>
                <div class="item9">栏目九</div>
            </div>
        </div>
        <!-- 页脚 -->
        <div class="footer">页脚</div>
    </div>
</body>

</html>
